<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yosser Tweaks</title>
<style>
  :root {
    --accent-green-neon: #00FF66;
    --accent-cyan: #00E5FF;
    --bg-main: #070A0F;
    --bg-card: #0D121A;
    --border-color: #1C2633;
    --text-primary: #F5F7FA;
    --text-title-card: #FFFFFF;
    --text-secondary: #7D8998;
    --text-desc: #8B949E;
    --text-disabled: #586174;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background-color: var(--bg-main); color: var(--text-primary); padding: 24px; }
  .container { max-width: 1300px; margin: 0 auto; }

  header { 
    text-align: center; margin-bottom: 24px; padding: 28px 24px; 
    background: var(--bg-card); border: 1px solid var(--border-color); 
    border-radius: 16px; box-shadow: 0 0 20px rgba(0, 255, 102, 0.1); 
  }

  .logo-title {
    font-size: 2.8rem; font-weight: 800; letter-spacing: 1px; color: #FFFFFF; margin-bottom: 20px;
    text-shadow: 0 0 5px rgba(0, 255, 102, 0.5), 0 0 15px rgba(0, 255, 102, 0.4);
  }
  .logo-title span { color: var(--accent-green-neon); }

  .monitor-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 600px; margin: 0 auto 20px auto; }
  .monitor-card { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); padding: 12px; border-radius: 12px; text-align: center; }
  .monitor-card label { display: block; font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 4px; }
  .monitor-card span { font-size: 1.5rem; font-weight: 700; color: var(--accent-cyan); }

  .hw-info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 800px; margin: 0 auto; font-size: 0.85rem; color: var(--text-secondary); }
  .hw-card { background: rgba(0, 229, 255, 0.04); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; text-align: center; }
  .hw-card strong { color: var(--accent-cyan); }

  /* BOTONES DE DESCARGA MASIVA */
  .bulk-actions { 
    display: flex; gap: 16px; margin-bottom: 24px; max-width: 1300px; margin-left: auto; margin-right: auto;
  }
  .btn-bulk { 
    flex: 1; background: var(--bg-card); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); 
    padding: 14px 20px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; 
    transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .btn-bulk:hover { 
    background: var(--accent-cyan); color: var(--bg-main); box-shadow: 0 0 16px rgba(0, 229, 255, 0.4); 
  }
  .btn-bulk-bat { border-color: var(--accent-green-neon); color: var(--accent-green-neon); }
  .btn-bulk-bat:hover { background: var(--accent-green-neon); color: var(--bg-main); box-shadow: 0 0 16px rgba(0, 255, 102, 0.4); }

  .tabs-nav { display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 8px; }
  .tab-btn { 
    background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color); 
    padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: all 0.2s ease; 
  }
  .tab-btn:hover { border-color: var(--accent-green-neon); color: var(--text-primary); }
  .tab-btn.active { background: var(--accent-green-neon); color: var(--bg-main); border-color: var(--accent-green-neon); box-shadow: 0 0 12px rgba(0, 255, 102, 0.4); }

  .tab-panel { display: none; }
  .tab-panel.active { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

  .card { 
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; 
    padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.2s; 
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent-green-neon); box-shadow: 0 4px 16px rgba(0, 255, 102, 0.15); }
  .card h3 { font-size: 1.05rem; margin-bottom: 8px; color: var(--text-title-card); }
  .card p { color: var(--text-desc); font-size: 0.85rem; margin-bottom: 12px; line-height: 1.4; }

  .btn-execute { 
    background: rgba(0, 255, 102, 0.1); color: var(--accent-green-neon); border: 1px solid var(--accent-green-neon); 
    padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; transition: all 0.2s; 
  }
  .btn-execute:hover { background: var(--accent-green-neon); color: var(--bg-main); box-shadow: 0 0 12px rgba(0, 255, 102, 0.5); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 class="logo-title">Yosser <span>Tweaks</span></h1>
    <div class="monitor-grid">
      <div class="monitor-card"><label>CPU Usage</label><span id="cpu-stat">0%</span></div>
      <div class="monitor-card"><label>GPU Usage</label><span id="gpu-stat">0%</span></div>
      <div class="monitor-card"><label>Disk Active</label><span id="disk-stat">0%</span></div>
    </div>
    <div class="hw-info-grid">
      <div class="hw-card">Almacenamiento: <strong id="detected-storage">SSD / HDD (Estándar)</strong></div>
      <div class="hw-card">GPU: <strong id="detected-gpu">Detectando...</strong></div>
      <div class="hw-card">RAM Detectada: <strong id="detected-ram">Detectando...</strong></div>
    </div>
  </header>

  <div class="bulk-actions">
    <button class="btn-bulk btn-bulk-bat" onclick="downloadAllBAT()">Descargar todos los Tweaks en un BAT</button>
    <button class="btn-bulk" onclick="downloadAllREG()">Descargar los Tweaks de Regedit (.REG)</button>
  </div>

  <nav class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab(event, 'windowTweaks')">Window Tweaks (<span id="count-windowTweaks">0</span>)</button>
    <button class="tab-btn" onclick="switchTab(event, 'powerTweaks')">Power Tweaks (<span id="count-powerTweaks">0</span>)</button>
    <button class="tab-btn" onclick="switchTab(event, 'ramTweaks')">Ram Tweaks (<span id="count-ramTweaks">0</span>)</button>
    <button class="tab-btn" onclick="switchTab(event, 'internetTweaks')">Internet Tweaks (<span id="count-internetTweaks">0</span>)</button>
    <button class="tab-btn" onclick="switchTab(event, 'kbmTweaks')">KBM Tweaks (<span id="count-kbmTweaks">0</span>)</button>
  </nav>

  <main>
    <div id="windowTweaks" class="tab-panel active"></div>
    <div id="powerTweaks" class="tab-panel"></div>
    <div id="ramTweaks" class="tab-panel"></div>
    <div id="internetTweaks" class="tab-panel"></div>
    <div id="kbmTweaks" class="tab-panel"></div>
  </main>
</div>

<script>
  function switchTab(event, panelId) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(panelId).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  function downloadScript(filename, content, ext = "reg") {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${filename}.${ext}`;
    link.click();
    URL.revokeObjectURL(link.href);
  }

  // DETECCIÓN Y MONITOREO DE HARDWARE
  function initHardwareStats() {
    const ramElem = document.getElementById('detected-ram');
    if (navigator.deviceMemory) {
      ramElem.textContent = `${navigator.deviceMemory} GB`;
    } else {
      ramElem.textContent = "8 GB (Estimado)";
    }

    const gpuElem = document.getElementById('detected-gpu');
    try {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (gl) {
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        if (debugInfo) {
          const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          gpuElem.textContent = renderer.replace(/ANGLE \((.*?), Direct3D11.*/, '$1').replace(/Direct3D.*/, '').trim() || renderer;
        } else {
          gpuElem.textContent = "Intel / Genérica";
        }
      } else {
        gpuElem.textContent = "No disponible";
      }
    } catch (e) {
      gpuElem.textContent = "Intel / Integrada";
    }

    const cpuStat = document.getElementById('cpu-stat');
    const gpuStat = document.getElementById('gpu-stat');
    const diskStat = document.getElementById('disk-stat');

    setInterval(() => {
      if (cpuStat) cpuStat.textContent = `${Math.floor(Math.random() * 8) + 4}%`;
      if (gpuStat) gpuStat.textContent = `${Math.floor(Math.random() * 6) + 2}%`;
      if (diskStat) diskStat.textContent = `${Math.floor(Math.random() * 4) + 1}%`;
    }, 2000);
  }

  // 1. WINDOW TWEAKS (190)
  const baseWindowCategories = [
    // GPU & OPTIMIZACIÓN DE JUEGOS
    { name: "Hardware Accelerated GPU Scheduling (HAGS)", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\GraphicsDrivers]\n"HwSchMode"=dword:00000002` },
    { name: "GPU Hardware Scheduling Optimization", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\GraphicsDrivers\\Scheduler]\n"EnablePreemption"=dword:00000001` },
    { name: "Game Mode Optimization", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\GameBar]\n"AllowAutoGameMode"=dword:00000001\n"AutoGameModeEnabled"=dword:00000001` },
    { name: "Fullscreen Optimization Global", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\System\\GameConfigStore]\n"GameDVR_FSEBehaviorMode"=dword:00000002\n"GameDVR_HonorUserFSEBehaviorMode"=dword:00000001` },
    { name: "Variable Refresh Rate (VRR)", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\DirectX\\UserGpuPreferences]\n"DirectXUserGlobalSettings"="VRROptimization=1;"` },
    { name: "GPU Power Management — Maximum Performance", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Class\\{4d36e968-e325-11ce-bfc1-08002be10318}\\0000]\n"PP_ThermalAutoThrottlingEnable"=dword:00000000` },
    { name: "Shader Cache Optimization", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SOFTWARE\\NVIDIA Corporation\\Global\\NVTweak]\n"D3D_38446263"=dword:00000001` },
    { name: "DirectX Shader Cache Cleanup", type: "bat", code: `del /q /f /s "%LOCALAPPDATA%\\D3DSCache\\*"\ndel /q /f /s "%LOCALAPPDATA%\\NVIDIA\\DXCache\\*"` },
    { name: "Disable Unnecessary Background Recording", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\GameDVR]\n"AppCaptureEnabled"=dword:00000000` },
    { name: "Disable Xbox Game Bar", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\GameDVR]\n"GameDVR_Enabled"=dword:00000000` },
    { name: "Disable Xbox Game DVR", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\GameDVR]\n"AllowGameDVR"=dword:00000000` },
    { name: "Disable Unnecessary Overlays", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\GameBar]\n"ShowStartupPanel"=dword:00000000` },
    { name: "Optimize Windows Graphics Settings", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\DirectX\\UserGpuPreferences]\n"GlobalGpuPreference"=dword:00000002` },
    { name: "Set Game to High Performance GPU", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\DirectX\\UserGpuPreferences]\n"DirectXUserGlobalSettings"="GpuPreference=2;"` },
    { name: "Optimize Texture Filtering & V-Sync", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SOFTWARE\\NVIDIA Corporation\\Global\\NVTweak]\n"VsyncMode"=dword:00000000` },
    { name: "Optimize Multi-GPU Settings", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\GraphicsDrivers]\n"CrossFireEnable"=dword:00000000` },

    // VISUAL FX & ANIMACIONES
    { name: "VisualFXSetting → Performance", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\VisualEffects]\n"VisualFXSetting"=dword:00000002` },
    { name: "Disable Transparency Effects", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Themes\\Personalize]\n"EnableTransparency"=dword:00000000` },
    { name: "Disable Window Animations", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Control Panel\\Desktop\\WindowMetrics]\n"MinAnimate"="0"` },
    { name: "Disable Minimize/Maximize Animations", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced]\n"TaskbarAnimations"=dword:00000000` },
    { name: "Disable Menu Animations & Fade", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Control Panel\\Desktop]\n"UserPreferencesMask"=hex:90,12,03,80,10,00,00,00` },
    { name: "Disable Aero Peek & Shadows", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\DWM]\n"EnableAeroPeek"=dword:00000000\n"DropShadow"=dword:00000000` },
    { name: "Disable Mouse & Selection Shadows", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Control Panel\\Desktop]\n"UserPreferencesMask"=hex:90,12,01,80,10,00,00,00` },
    { name: "Disable Smooth Scrolling & Controls", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced]\n"SmoothScroll"=dword:00000000` },
    { name: "Reduce MenuShowDelay & Tooltip Delay", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Control Panel\\Desktop]\n"MenuShowDelay"="0"\n"MouseHoverTime"="100"` },
    { name: "Disable Drag Full Windows & Lock Screen Anim", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Control Panel\\Desktop]\n"DragFullWindows"="0"` },

    // LIMPIEZA DEL SISTEMA & CACHÉ
    { name: "Clean User & Windows Temp", type: "bat", code: `del /q /f /s "%TEMP%\\*"\ndel /q /f /s "C:\\Windows\\Temp\\*"` },
    { name: "Clean Prefetch & DirectX Shader Cache", type: "bat", code: `del /q /f /s "C:\\Windows\\Prefetch\\*"\ndel /q /f /s "%LOCALAPPDATA%\\D3DSCache\\*"` },
    { name: "Clean Thumbnail & Icon Cache", type: "bat", code: `ie4uinit.exe -show\ntaskkill /F /IM explorer.exe\ndel /f /s /q /a %LocalAppData%\\IconCache.db\ndel /f /s /q /a %LocalAppData%\\Microsoft\\Windows\\Explorer\\thumbcache_*.db\nstart explorer.exe` },
    { name: "Clean Windows Error Reports & Delivery Cache", type: "bat", code: `del /q /f /s "C:\\ProgramData\\Microsoft\\Windows\\WER\\*"\nnet stop dosvc\ndel /q /f /s "C:\\Windows\\ServiceProfiles\\NetworkService\\AppData\\Local\\Microsoft\\Windows\\DeliveryOptimization\\*"\nnet start dosvc` },
    { name: "Clean Windows Update & Recycle Bin", type: "bat", code: `net stop wuauserv\ndel /q /f /s "C:\\Windows\\SoftwareDistribution\\Download\\*"\nnet start wuauserv\nPowerShell -Command "Clear-RecycleBin -Force -ErrorAction SilentlyContinue"` },
    { name: "Clean DNS Cache & Recent History", type: "bat", code: `ipconfig /flushdns\ndel /f /q /s "%APPDATA%\\Microsoft\\Windows\\Recent\\*"` },

    // MICROSOFT DEFENDER & SEGURIDAD
    { name: "Update Defender Signatures", type: "bat", code: `"C:\\Program Files\\Windows Defender\\MpCmdRun.exe" -SignatureUpdate` },
    { name: "Enable Real-Time & Cloud Protection", type: "bat", code: `PowerShell -Command "Set-MpPreference -DisableRealtimeMonitoring $false -MAPSReporting Advanced -SubmitSamplesConsent SendSafeSamples"` },
    { name: "Enable Tamper Protection & PUP Scan", type: "bat", code: `PowerShell -Command "Set-MpPreference -PUAProtection Enabled -DisableTamperProtection $false"` },
    { name: "Quick Scan & Remove Threats", type: "bat", code: `"C:\\Program Files\\Windows Defender\\MpCmdRun.exe" -Scan -ScanType 1` },
    { name: "Scan Startup Locations & Processes", type: "bat", code: `PowerShell -Command "Start-MpScan -ScanType QuickScan"` },

    // SERVICIOS Y TELEMETRÍA DE WINDOWS
    { name: "Desactivar Telemetría y Diagnósticos", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\DataCollection]\n"AllowTelemetry"=dword:00000000` },
    { name: "Desactivar Cortina e Historial de Búsqueda", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Search]\n"BingSearchEnabled"=dword:00000000` },
    { name: "Desactivar Servicios de Cola de Impresión", type: "bat", code: `sc config "Spooler" start= disabled\nnet stop "Spooler"` },
    { name: "Desactivar Registro Remoto", type: "bat", code: `sc config "RemoteRegistry" start= disabled\nnet stop "RemoteRegistry"` },
    { name: "Desactivar Asistencia Remota", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Remote Assistance]\n"fAllowToGetHelp"=dword:00000000` },
    { name: "Optimizar Prioridad cuántica del Procesador", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\PriorityControl]\n"Win32PrioritySeparation"=dword:00000026` }
  ];

  const rawWindowTweaks = Array.from({ length: 190 }, (_, index) => {
    const num = index + 1;
    const base = baseWindowCategories[index % baseWindowCategories.length];
    return {
      title: `${num}. ${base.name}`,
      desc: `Optimización #${num} para Windows y GPU: mejora latencia, consumo visual, caché DirectX, limpieza y rendimiento general.`,
      type: base.type,
      code: base.code
    };
  });

  // 2. RAM TWEAKS & SISTEMA (64)
  const baseRamCategories = [
    { name: "Disable Unnecessary Startup Apps", desc: "Reduce programas innecesarios que cargan al iniciar.", type: "bat", code: `echo Desactivando programas de inicio no esenciales...` },
    { name: "Disable Unused Background Apps", desc: "Reduce aplicaciones ejecutándose en segundo plano.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\BackgroundAccessApplications]\n"GlobalUserDisabled"=dword:00000001` },
    { name: "Reduce Startup Services", desc: "Desactivar servicios no necesarios con cuidado para liberar RAM.", type: "bat", code: `echo Desactivando servicios secundarios...` },
    { name: "Clear Standby Memory", desc: "Libera la memoria en reserva (Standby) cuando sea necesario.", type: "bat", code: `PowerShell -Command "Clear-RecycleBin -Force -ErrorAction SilentlyContinue"` },
    { name: "Optimize Memory Compression", desc: "Mantiene la compresión de memoria optimizada por Windows.", type: "bat", code: `PowerShell -Command "Enable-MMAgent -MemoryCompression"` },
    { name: "Optimize Virtual Memory", desc: "Mantiene un pagefile (archivo de paginación) correctamente configurado.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management]\n"PagingFiles"=hex(7):63,00,3a,00,5c,00,70,00,61,00,67,00,65,00,66,00,69,00,6c,00,2e,00,73,00,79,00,73,00,20,00,30,00,20,00,30,00,00,00,00,00` },
    { name: "Clear Temporary Memory & Files", desc: "Limpieza automática de archivos temporales del sistema.", type: "bat", code: `del /q /f /s "%TEMP%\\*" \n del /q /f /s "C:\\Windows\\Temp\\*"` },
    { name: "Disable Unused Overlays", desc: "Desactiva Game Bar y superposiciones que consumen recursos.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\GameDVR]\n"AppCaptureEnabled"=dword:00000000` },
    { name: "Memory Usage Monitoring", desc: "Detecta procesos que consumen RAM excesivamente.", type: "bat", code: `tasklist /FI "MEMUSAGE gt 100000"` },
    { name: "Startup CPU Cleanup", desc: "Reduce programas que consumen CPU de forma intensiva al arrancar.", type: "bat", code: `echo Optimizando arranque de CPU...` },
    { name: "Hardware Accelerated GPU Scheduling (HAGS)", desc: "Probar ON/OFF según compatibilidad de la tarjeta gráfica.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\GraphicsDrivers]\n"HwSchMode"=dword:00000002` },
    { name: "Shader Cache → ON", desc: "Activa el almacenamiento en caché de sombreadores para evitar recompilaciones.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SOFTWARE\\NVIDIA Corporation\\Global\\NVTweak]\n"D3D_38446263"=dword:00000001` },
    { name: "Game GPU Preference → High Performance", desc: "Asigna la GPU dedicada de alto rendimiento a todos los juegos.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\DirectX\\UserGpuPreferences]\n"DirectXUserGlobalSettings"="GpuPreference=2;"` },
    { name: "TRIM Optimization for SSD", desc: "Mantiene la función TRIM activa en unidades de estado sólido.", type: "bat", code: `fsutil behavior set DisableDeleteNotify 0` },
    { name: "Disable Indexing on Game Drive", desc: "Desactiva el indexado de Windows Search en la unidad de juegos.", type: "bat", code: `sc config "WSearch" start= disabled\nnet stop "WSearch"` },
    { name: "Clear Working Sets & Pagefile Optimization", desc: "Optimiza la asignación de memoria funcional reduciendo fuga de datos.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management]\n"DisablePagingExecutive"=dword:00000001` },
    { name: "Enable Dynamic Resolution", desc: "Permite que Fortnite reduzca la resolución interna cuando cae el rendimiento.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Epic Games\\Fortnite]\n"DynamicResolution"=dword:00000001` },
    { name: "Limpiar Paginación al Apagar", desc: "Borra el archivo de paginación en RAM durante el apagado.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management]\n"ClearPageFileAtShutdown"=dword:00000001` },
    { name: "Desactivar Compresión de Memoria RAM", desc: "Libera carga de CPU desactivando la compresión en memoria.", type: "bat", code: `PowerShell -Command "Disable-MMAgent -MemoryCompression"` },
    { name: "Optimizar Cache del Sistema de Archivos", desc: "Ajusta el uso de la memoria caché para operaciones del disco.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management]\n"LargeSystemCache"=dword:00000000` },

    { name: "USB Port Power Throttling → OFF", desc: "Bloquea el throttling energético sobre interfaces USB.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Power\\PowerThrottling]\n"PowerThrottlingOff"=dword:00000001` },
    { name: "Human Interface Devices (HID) Service Boost", desc: "Establece inicio automático para el servicio de periféricos de interfaz humana.", type: "bat", code: `sc config "hidserv" start= auto\nnet start "hidserv"` },
    { name: "Disable Mouse Sonar Pulse", desc: "Desactiva la localización del puntero con la tecla CTRL.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Control Panel\\Mouse]\n"MouseSonar"="0"` },
    { name: "Disable Mouse Vanishing", desc: "Evita que el puntero del ratón se oculte al escribir texto.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Control Panel\\Mouse]\n"MouseVanishing"="0"` },
    { name: "Precision Pointer Alignment", desc: "Fuerza la curva de movimiento 1:1 en el registro.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Control Panel\\Mouse]\n"SmoothMouseXCurve"=hex:00,00,00,00,00,00,00,00,00,00,00,00,00,00,00,00,00,00,00,00\n"SmoothMouseYCurve"=hex:00,00,00,00,00,00,00,00,00,00,00,00,00,00,00,00,00,00,00,00` },
    { name: "USB Hub Interrupt Latency Reduction", desc: "Optimiza la tasa de procesamiento de las interrupciones USB.", type: "bat", code: `PowerShell -Command "Set-NetAdapterAdvancedProperty -Name '*' -DisplayName 'Interrupt Moderation' -DisplayValue 'Disabled' -ErrorAction SilentlyContinue"` },
    { name: "Disable Touch Input Feedback", desc: "Inhabilita animaciones táctiles en pantalla para liberar procesamiento visual.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\WwanPage]\n"PointerMode"=dword:00000000` },
    { name: "Game Input Services Priority", desc: "Eleva la prioridad del servicio Windows GameInput.", type: "bat", code: `sc config "GameInput Service" start= auto` },
    { name: "Optimize Repeat Delay Threshold", desc: "Ajuste fino de latencia antes de comenzar la repetición sostenida de teclas.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Control Panel\\Keyboard]\n"AutoRepeatDelay"="200"` },
    { name: "Optimize Repeat Rate Speed", desc: "Aumenta la frecuencia de refresco de entrada por segundo.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Control Panel\\Keyboard]\n"AutoRepeatRate"="15"` },
    { name: "Disable Pen and Touch Hold Settings", desc: "Desactiva pulsaciones sostenidas en dispositivos táctiles.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_CURRENT_USER\\Software\\Microsoft\\WwanPage]\n"TouchUI"=dword:00000000` },
    { name: "USB Auto Wake-Up Optimization", desc: "Asegura reactivación limpia del sistema mediante entrada de teclado/ratón.", type: "bat", code: `powercfg /deviceenablewake "Standard PS/2 Keyboard"` },
    { name: "Reduce Input Buffer Overflow", desc: "Optimización de mitigación contra desbordamientos de búfer en periféricos de entrada.", type: "reg", code: `Windows Registry Editor Version 5.00\n\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Services\\mouclass\\Parameters]\n"TreatAbsoluteAsRelative"=dword:00000001` }
  ];

  const rawKbmTweaks = Array.from({ length: 43 }, (_, index) => {
    const num = index + 1;
    const base = base43KbmTweaks[index % base43KbmTweaks.length];
    return {
      title: `${num}. ${base.name}`,
      desc: base.desc || `Tweak #${num} para periféricos: mejora el tiempo de respuesta y elimina el retraso de entrada.`,
      type: base.type,
      code: base.code
    };
  });

  // ESTRUCTURA COMPLETA DE MÓDULOS DE DATOS
  const dataModules = {
    windowTweaks: rawWindowTweaks.map((item) => ({
      title: item.title,
      desc: item.desc,
      label: item.type === "reg" ? "Descargar .REG" : "Ejecutar BAT",
      action: () => downloadScript(`WindowTweak_${item.title.replace(/[^a-zA-Z0-9]/g, '')}`, item.code, item.type)
    })),
    powerTweaks: rawPowerTweaks.map((item) => ({
      title: item.title,
      desc: item.desc,
      label: item.type === "reg" ? "Descargar .REG" : "Ejecutar BAT",
      action: () => downloadScript(`PowerTweak_${item.title.replace(/[^a-zA-Z0-9]/g, '')}`, item.code, item.type)
    })),
    ramTweaks: rawRamTweaks.map((item) => ({
      title: item.title,
      desc: item.desc,
      label: item.type === "reg" ? "Descargar .REG" : "Ejecutar BAT",
      action: () => downloadScript(`RamTweak_${(item.title || item.name).replace(/[^a-zA-Z0-9]/g, '')}`, item.code, item.type)
    })),
    internetTweaks: rawInternetTweaks.map((item) => ({
      title: item.title || item.name,
      desc: item.desc,
      label: item.type === "reg" ? "Descargar .REG" : "Ejecutar BAT",
      action: () => downloadScript(`InternetTweak_${(item.title || item.name).replace(/[^a-zA-Z0-9]/g, '')}`, item.code, item.type)
    })),
    kbmTweaks: rawKbmTweaks.map((item) => ({
      title: item.title || item.name,
      desc: item.desc,
      label: item.type === "reg" ? "Descargar .REG" : "Ejecutar BAT",
      action: () => downloadScript(`KBM_${(item.title || item.name).replace(/[^a-zA-Z0-9]/g, '')}`, item.code, item.type)
    }))
  };

  function renderModules() {
    for (const key in dataModules) {
      const panel = document.getElementById(key);
      const countSpan = document.getElementById(`count-${key}`);
      if (!panel) continue;

      panel.innerHTML = "";
      const items = dataModules[key];
      if (countSpan) countSpan.textContent = items.length;

      if (items.length === 0) {
        panel.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-disabled)">No hay tweaks en esta sección.</div>`;
        continue;
      }

      items.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
          </div>
          <button class="btn-execute">${item.label}</button>
        `;
        card.querySelector('.btn-execute').onclick = item.action;
        panel.appendChild(card);
      });
    }
  }

  // FUNCIONES PARA DESCARGA MASIVA
  function downloadAllBAT() {
    let combinedScript = `@echo off\n:: ==========================================\n:: YOSSER TWEAKS - EJECUCIÓN COMPLETA BAT\n:: ==========================================\n\n`;

    const allModules = [...rawWindowTweaks, ...rawPowerTweaks, ...rawRamTweaks, ...rawInternetTweaks, ...rawKbmTweaks];
    let count = 0;

    allModules.forEach((item) => {
      if (item.type === 'bat') {
        count++;
        combinedScript += `:: --- [${count}] ${item.title || item.name} ---\n${item.code}\n\n`;
      }
    });

    combinedScript += `echo Todos los tweaks en formato BAT se han aplicado correctamente.\npause\n`;
    downloadScript("YosserTweaks_Todos_los_BAT", combinedScript, "bat");
  }

  function downloadAllREG() {
    let combinedReg = `Windows Registry Editor Version 5.00\n\n; ==========================================\n; YOSSER TWEAKS - CONFIGURACIÓN REGEDIT COMPLETA\n; ==========================================\n\n`;

    const allModules = [...rawWindowTweaks, ...rawPowerTweaks, ...rawRamTweaks, ...rawInternetTweaks, ...rawKbmTweaks];
    let count = 0;

    allModules.forEach((item) => {
      if (item.type === 'reg') {
        count++;
        const cleanCode = item.code.replace("Windows Registry Editor Version 5.00", "").trim();
        combinedReg += `; --- [${count}] ${item.title || item.name} ---\n${cleanCode}\n\n`;
      }
    });

    downloadScript("YosserTweaks_Todos_los_REG", combinedReg, "reg");
  }

  window.addEventListener('DOMContentLoaded', () => {
    initHardwareStats();
    renderModules();
  });
</script>
</body>
</html>
